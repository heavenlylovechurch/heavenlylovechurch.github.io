  <link rel="stylesheet" href="css/style.css?v=28">
</head>
<body class="page-inner">
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand-wrap" href="index.html">
        <span class="mark"><img src="images/cross.svg" alt=""></span>
        <span class="brand">하늘사랑침례교회</span>
      </a>
      <button class="menu-btn" aria-label="메뉴">☰</button>
                  <nav class="nav">
        <a href="index.html">홈</a>
        <div class="has-sub">
          <a href="about.html" class="active">소개</a>
          <div class="sub">
            <a href="greeting.html">인사말</a>
            <a href="history.html">교회 연혁</a>
            <a href="vision.html">교회비전</a>
            <a href="spaces.html">교회 공간안내</a>
            <a href="location.html">오시는 길</a>
            <a href="contact.html">연락처</a>
          </div>
        </div>
        <a href="worship.html">예배 안내</a>
        <a href="newfamily.html">새가족 등록 안내</a>
        <a href="choir.html">시온찬양대</a>
        <a href="sermon.html">설교</a>
        <a href="seasia.html">동남아비전센터</a>
      </nav>
    </div>
  </header>

  <div class="wrap page-hero">
    <p class="eyebrow">SPACE</p>
    <h1>교회공간안내</h1>
    <p class="section-desc">층을 누르면 사진을 볼 수 있습니다. 사진은 임시입니다.</p>
  </div>
  <section class="section"><div class="wrap floor-list">
    <button class="floor" data-floor="1">
      <img src="images/floor1.jpg" alt="">
      <div><strong>1층</strong><span>사무실 · 식당 · 카페</span></div>
    </button>
    <button class="floor" data-floor="2">
      <img src="images/floor2.jpg" alt="">
      <div><strong>2층</strong><span>본당 · 로비</span></div>
    </button>
    <button class="floor" data-floor="3">
      <img src="images/floor3.jpg" alt="">
      <div><strong>3층</strong><span>유초등부 예배실</span></div>
    </button>
    <button class="floor" data-floor="4">
      <img src="images/floor4.jpg" alt="">
      <div><strong>4층</strong><span>작은 도서관 · 침례탕</span></div>
    </button>
  </div></section>
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <button class="modal-x" type="button">닫기</button>
      <h3 id="modal-title"></h3>
      <div class="modal-grid" id="modal-grid"></div>
    </div>
  </div>
  <div class="viewer" id="viewer" hidden>
    <button class="modal-x" type="button">닫기</button>
    <img id="viewer-img" alt="">
  </div>
  <script>
    const floors = {
      1: { title: "1층", photos: ["images/floor1.jpg", "images/about.jpg"] },
      2: { title: "2층", photos: ["images/floor2.jpg", "images/sanctuary.jpg", "images/worship.jpg"] },
      3: { title: "3층", photos: ["images/floor3.jpg", "images/detail.jpg"] },
      4: { title: "4층", photos: ["images/floor4.jpg", "images/hero.jpg"] }
    };
    const modal = document.getElementById("modal");
    const grid = document.getElementById("modal-grid");
    const title = document.getElementById("modal-title");
    const viewer = document.getElementById("viewer");
    const vimg = document.getElementById("viewer-img");
    document.querySelectorAll(".floor").forEach(btn => {
      btn.addEventListener("click", () => {
        const data = floors[btn.dataset.floor];
        title.textContent = data.title;
        grid.innerHTML = data.photos.map(src => `<button type="button" class="thumb"><img src="${src}" alt=""></button>`).join("");
        modal.hidden = false;
        grid.querySelectorAll(".thumb").forEach(th => th.addEventListener("click", () => {
          vimg.src = th.querySelector("img").src;
          viewer.hidden = false;
        }));
      });
    });
    modal.querySelector(".modal-x").onclick = () => modal.hidden = true;
    modal.addEventListener("click", e => { if (e.target === modal) modal.hidden = true; });
    viewer.querySelector(".modal-x").onclick = () => viewer.hidden = true;
    viewer.addEventListener("click", e => { if (e.target === viewer) viewer.hidden = true; });
  </script>

  <script src="js/main.js"></script>
</body>
</html>
