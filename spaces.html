  <div class="wrap page-hero">
    <p class="eyebrow">SPACE</p>
    <h1>교회공간안내</h1>
    <p class="section-desc">층을 누르면 실제 교회 공간 사진을 볼 수 있습니다.</p>
  </div>
  <section class="section"><div class="wrap floor-list">
    <button class="floor floor-first" data-floor="1">
      <img src="images/floor1-main.jpg" alt="1층 카페와 식당 전경">
      <div><strong>1층</strong><span>사무실 · 식당 · 카페</span></div>
    </button>
    <button class="floor floor-second" data-floor="2">
      <img src="images/floor2-main.jpg" alt="2층 본당 전경">
      <div><strong>2층</strong><span>본당 · 로비</span></div>
    </button>
    <button class="floor floor-third" data-floor="3">
      <img src="images/floor3-main.jpg" alt="3층 유초등부 예배 공간">
      <div><strong>3층</strong><span>유초등부 예배실</span></div>
    </button>
    <button class="floor floor-fourth" data-floor="4">
      <img src="images/floor4-main.jpg" alt="4층 공간과 책장 전경">
      <div><strong>4층</strong><span>작은 도서관 · 침례탕</span></div>
    </button>
  </div></section>
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <button class="modal-x" type="button">닫기</button>
      <h3 id="modal-title"></h3>
      <div class="modal-grid" id="modal-grid"></div>
    </div>
  </div>
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="공간 사진 크게 보기" hidden>
    <button class="modal-x" type="button">닫기</button>
    <figure class="viewer-stage">
      <div class="viewer-image-wrap">
        <img id="viewer-img" alt="">
        <button class="viewer-arrow viewer-prev" type="button" aria-label="이전 사진">‹</button>
        <button class="viewer-arrow viewer-next" type="button" aria-label="다음 사진">›</button>
      </div>
      <figcaption id="viewer-count" aria-live="polite"></figcaption>
    </figure>
  </div>
  <script>
    const floors = {
      1: { title: "1층", photos: [
        "images/floor1-main.jpg", "images/floor1-entrance.jpg", "images/floor1-cafe-wide.jpg",
        "images/floor1-office.jpg", "images/floor1-cafe-counter.jpg", "images/floor1-cafe-seating.jpg",
        "images/floor1-dining-wide.jpg", "images/floor1-music.jpg",
        "images/floor1-dining-kitchen.jpg", "images/floor1-dining.jpg"
      ] },
      2: { title: "2층", photos: [
        "images/floor2-main.jpg", "images/floor2-lobby.jpg", "images/floor2-fellowship.jpg",
        "images/floor2-lobby-sanctuary.jpg", "images/floor2-sanctuary-left.jpg",
        "images/floor2-sanctuary-right.jpg"
      ] },
      3: { title: "3층", photos: [
        "images/floor3-main.jpg", "images/floor3-entry.jpg", "images/floor3-window.jpg",
        "images/floor3-overview.jpg", "images/floor3-children.jpg", "images/floor3-balcony.jpg"
      ] },
      4: { title: "4층", photos: [
        "images/floor4-main.jpg", "images/floor4-room.jpg", "images/floor4-library-wide.jpg",
        "images/floor4-library.jpg", "images/floor4-books.jpg", "images/floor4-play.jpg",
        "images/floor4-hall.jpg", "images/floor4-rooftop.jpg", "images/floor4-rooftop-corner.jpg"
      ] }
    };
    const modal = document.getElementById("modal");
    const grid = document.getElementById("modal-grid");
    const title = document.getElementById("modal-title");
    const viewer = document.getElementById("viewer");
    const stage = viewer.querySelector(".viewer-stage");
    const vimg = document.getElementById("viewer-img");
    const counter = document.getElementById("viewer-count");
    let activePhotos = [];
    let activeIndex = 0;
    let activeTitle = "";
    let activeFloor = "";
    function fitViewerPhoto() {
      if (!vimg.naturalWidth || !vimg.naturalHeight) return;
      const maxWidth = Math.min(960, window.innerWidth - 48);
      const maxHeight = Math.max(120, window.innerHeight - 124);
      stage.style.width = `${Math.floor(Math.min(maxWidth, maxHeight * vimg.naturalWidth / vimg.naturalHeight))}px`;
    }
    vimg.addEventListener("load", fitViewerPhoto);
    window.addEventListener("resize", fitViewerPhoto);
    function showPhoto(index) {
      activeIndex = (index + activePhotos.length) % activePhotos.length;
      vimg.src = activePhotos[activeIndex];
      vimg.alt = `${activeTitle} 공간 사진 ${activeIndex + 1}`;
      counter.textContent = `${activeIndex + 1} / ${activePhotos.length}`;
      viewer.classList.toggle("real-floor-image", true);
      viewer.hidden = false;
      if (vimg.complete) fitViewerPhoto();
    }
    function closeViewer() { viewer.hidden = true; }
    document.querySelectorAll(".floor").forEach(btn => {
      btn.addEventListener("click", () => {
        const data = floors[btn.dataset.floor];
        title.textContent = data.title;
        activePhotos = data.photos;
        activeTitle = data.title;
        activeFloor = btn.dataset.floor;
        grid.classList.toggle("real-floor-images", true);
        grid.innerHTML = data.photos.map((src, i) => `<button type="button" class="thumb" aria-label="${data.title} 사진 ${i + 1} 크게 보기"><img src="${src}" alt="${data.title} 공간 사진 ${i + 1}" loading="lazy"></button>`).join("");
        modal.hidden = false;
        grid.querySelectorAll(".thumb").forEach((th, i) => th.addEventListener("click", () => showPhoto(i)));
      });
    });
    modal.querySelector(".modal-x").onclick = () => modal.hidden = true;
    modal.addEventListener("click", e => { if (e.target === modal) modal.hidden = true; });
    viewer.querySelector(".modal-x").onclick = closeViewer;
    viewer.querySelector(".viewer-prev").onclick = () => showPhoto(activeIndex - 1);
    viewer.querySelector(".viewer-next").onclick = () => showPhoto(activeIndex + 1);
    viewer.addEventListener("click", e => { if (e.target === viewer) closeViewer(); });
    document.addEventListener("keydown", e => {
      if (!viewer.hidden) {
        if (e.key === "ArrowLeft") { e.preventDefault(); showPhoto(activeIndex - 1); }
        if (e.key === "ArrowRight") { e.preventDefault(); showPhoto(activeIndex + 1); }
        if (e.key === "Escape") closeViewer();
      } else if (!modal.hidden && e.key === "Escape") modal.hidden = true;
    });
    let touchStart = null;
    viewer.addEventListener("touchstart", e => {
      if (e.touches.length === 1) touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    viewer.addEventListener("touchend", e => {
      if (!touchStart || !e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) showPhoto(activeIndex + (dx < 0 ? 1 : -1));
    }, { passive: true });
  </script>

  <script src="js/main.js?v=2"></script>
</body>
</html>
